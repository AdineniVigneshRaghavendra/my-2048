<body>
    <main>
        <header>
            <h1>2048</h1>
            <p>Join the numbers!</p>
            <p>Score: <b id="score">0</b> Best: <b id="best">0</b> <button onclick="start()">New game</button></p>

        </header>

        <div id="board"></div>
    </main>
    <style>
        *{ box-sizing: border-box;}
        body{
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #faf8ef;
            font-family: Arial, sans-serif;
            color: #776e65;
        }
        main { width: min(90vw, 360px);}
        h1 { font-size: 52px; margin: 0;}
        header {margin-bottom: 18px;}
        header p {margin: 5px 0;}
        #board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 8px;
            background: #bbada0;
            border-radius: 6px;

        }
        .tile {
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            border-radius: 4px;
            background: #cdc1b4;
            font-size: clamp(20px, 6vw, 32px);
            font-weight: bold;
        }

        button{
            background: #8f7a66;
            color: white;
            border: 0;
            border-radius: 4px;
            padding: 6px;
            cursor: pointer;
        }

        .v2{ background: #eee4da;}
        .v4 {background: #ede0c8;}
        .v8 {background: #f2b179;}

    </style>
    <script>
       const board = document.querySelector("#board");
       let tiles = Array(16).fill(0), score = 0, over=false, won=false;
       try { best = +localStorage.best || 0; } catch(e) {}

       function draw() {
        board.innerHTML = tiles.map(v =>
            `<div class="tile ${v ? "v"+v : ""}">${v||""}</div>`
           ).join("");

        document.querySelector("#score").textContent = score;
        document.querySelector("#best").textContent = best;

       }

       function addTile() {
        let empty = tiles.map((v,i) => v ? -1 : i).filter(i => i >= 0);
        if(empty.length)
           tiles[empty[Math.random()*empty.length|0]] = 
            Math.random() < .9 ? 2 : 4;
       }

       function move (direction) {
        if(over) return;
        let next = tiles.slice();

        for(let n=0; n<4; n++)
       {
        let ids = Array.from({length:4}, (_,i) => 
    direction===0 ? n*4+i :
    direction===1 ? n*4+3-i :
    direction===2 ? i*4+n : (3-i)*4+n
    );

    let values = ids.map(i => tiles[i]).filter(Boolean);
    let result = [];

  for(let i=0; i<values.length; i++){
    if(values[i]===values[i+1]) {
        score+=values[i]*2;
        if(score > best) {
            best=score;
            try {localStorage.best = best;} catch(e) {}
        }
        result.push(values[i]*2);
        i++;
    } else result.push(values[i]);
  }
  ids.forEach((id,i) => next[id] = result[i] || 0);
   
       }

       if(next.every((v,i) => v===tiles[i])) return;
       tiles = next;
       if(!won && tiles.includes(2048)) {
        won=true;
        alert("You win!")
       }
       addTile();
       over = !tiles.includes(0) && !tiles.some((v,i)=>
       i%4<3 && v===tiles[i+1] || i<12 && v===tiles[i+4]);
       draw();
       if(over && !won) alert("Game over!");
       }

       onkeydown = e => {
        let keys = ["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","a","d","w","s"];
        let d = keys.indexOf(e.key);
        if(d >= 0) {
            e.preventDefault();
            move(d < 4 ? d: [0,1,2,3][d-4]);
        }
       };

       function start() {
       tiles=Array(16).fill(0);
       score=0;
       over = false;
       won = false;
       addTile();
       addTile();
       draw();
       }
       start();
    </script>
</body>
